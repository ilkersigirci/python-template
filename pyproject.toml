[project]
name = "python-template"
version = "0.1.0"
description = "A cookiecutter template for Python projects"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "cookiecutter>=2.6.0",
]

[dependency-groups]
doc = [
    "zensical>=0.0.11",
]
test = [
    "pytest>=8.4.2",
]

[tool.uv]
default-groups = ["doc", "test"]
